<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Cyan to Purple to Pink Gradient for timelines and frames -->
    <linearGradient id="cyanPurpleGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#7f00ff" />
      <stop offset="100%" stop-color="#f857a6" />
    </linearGradient>
    
    <!-- Shutter center lens core radial gradient -->
    <radialGradient id="shutterCoreGrad" cx="24" cy="24" r="9" fx="24" fy="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7f00ff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Infinity Timeline Loop -->
  <path d="M 12,24 C 12,15 20,15 24,24 C 28,33 36,33 36,24 C 36,15 28,15 24,24 C 20,33 12,33 12,24 Z" stroke="url(#cyanPurpleGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Outer Rounded Camera/Polaroid Frame -->
  <rect x="5" y="5" width="38" height="38" rx="10" stroke="url(#cyanPurpleGrad)" stroke-width="3" stroke-linecap="round" opacity="0.9" />

  <!-- Lens Core (Representing photographic capture) -->
  <circle cx="24" cy="24" r="7.5" fill="url(#shutterCoreGrad)" />
  <circle cx="24" cy="24" r="5" stroke="#ffffff" stroke-width="1.2" opacity="0.9" />

  <!-- Floating Memory Crystal Sparks -->
  <circle cx="34" cy="14" r="1.5" fill="#f857a6" />
  <circle cx="14" cy="34" r="1.5" fill="#00f2fe" />
</svg>